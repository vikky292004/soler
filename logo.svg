<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#1a6fd4"/>
    </linearGradient>
    <linearGradient id="panel-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C853" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5ba8f5" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sun-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield background fill -->
  <path d="M60 4 L108 22 L108 64 C108 90 88 110 60 118 C32 110 12 90 12 64 L12 22 Z"
        fill="rgba(0,200,83,0.08)" stroke="url(#shield-grad)" stroke-width="2.5"/>

  <!-- Inner shield ring -->
  <path d="M60 12 L100 27 L100 64 C100 86 84 104 60 112 C36 104 20 86 20 64 L20 27 Z"
        fill="none" stroke="url(#shield-grad)" stroke-width="1" stroke-dasharray="3,4" opacity="0.4"/>

  <!-- Solar panel grid (2x2 matrix) -->
  <rect x="30" y="40" width="22" height="15" rx="2.5" fill="url(#panel-grad)" opacity="0.95"/>
  <rect x="55" y="40" width="22" height="15" rx="2.5" fill="url(#panel-grad)" opacity="0.78"/>
  <rect x="30" y="58" width="22" height="15" rx="2.5" fill="url(#panel-grad)" opacity="0.78"/>
  <rect x="55" y="58" width="22" height="15" rx="2.5" fill="url(#panel-grad)" opacity="0.62"/>
  <!-- Panel cell lines -->
  <line x1="41" y1="40" x2="41" y2="55" stroke="rgba(255,255,255,.2)" stroke-width=".8"/>
  <line x1="30" y1="47.5" x2="52" y2="47.5" stroke="rgba(255,255,255,.2)" stroke-width=".8"/>
  <line x1="66" y1="40" x2="66" y2="55" stroke="rgba(255,255,255,.2)" stroke-width=".8"/>
  <line x1="55" y1="47.5" x2="77" y2="47.5" stroke="rgba(255,255,255,.2)" stroke-width=".8"/>
  <line x1="41" y1="58" x2="41" y2="73" stroke="rgba(255,255,255,.2)" stroke-width=".8"/>
  <line x1="30" y1="65.5" x2="52" y2="65.5" stroke="rgba(255,255,255,.2)" stroke-width=".8"/>
  <line x1="66" y1="58" x2="66" y2="73" stroke="rgba(255,255,255,.2)" stroke-width=".8"/>
  <line x1="55" y1="65.5" x2="77" y2="65.5" stroke="rgba(255,255,255,.2)" stroke-width=".8"/>

  <!-- Sun (top-right) -->
  <circle cx="88" cy="32" r="10" fill="#FFC107" filter="url(#sun-glow)" opacity="0.92"/>
  <!-- Sun rays -->
  <line x1="88" y1="16" x2="88" y2="12" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="97.8" y1="22.2" x2="100.7" y2="19.3" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="104" y1="32" x2="108" y2="32" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="97.8" y1="41.8" x2="100.7" y2="44.7" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78.2" y1="22.2" x2="75.3" y2="19.3" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Electric bolt -->
  <path d="M62 77 L55 92 L61 92 L58 107 L71 88 L65 88 Z"
        fill="#FFC107" filter="url(#glow-filter)" opacity="0.95"/>
</svg>
